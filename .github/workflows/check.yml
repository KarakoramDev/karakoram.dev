# SPDX-License-Identifier: Apache-2.0
name: Check site

on:
  pull_request:

permissions:
  contents: read

env:
  KARAKORAM_REPO: KarakoramDev/Karakoram
  KARAKORAM_REF: main

jobs:
  build:
    # Builds the site against the current docs; ingestion and
    # starlight-links-validator fail the build on broken internal links.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out documentation source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.KARAKORAM_REPO }}
          ref: ${{ env.KARAKORAM_REF }}
          path: .karakoram-src
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (root base path)
        run: npm run build
        env:
          KARAKORAM_DOCS_DIR: .karakoram-src

      - name: Build (project-page base path)
        run: npm run build
        env:
          KARAKORAM_DOCS_DIR: .karakoram-src
          SITE_URL: https://karakoramdev.github.io
          BASE_PATH: /karakoram.dev
