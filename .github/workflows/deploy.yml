# SPDX-License-Identifier: Apache-2.0
name: Deploy site

# Manual only: Actions → Deploy site → Run workflow, or
# `gh workflow run deploy.yml -R KarakoramDev/karakoram.dev`.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KARAKORAM_REPO: KarakoramDev/Karakoram
  KARAKORAM_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out documentation source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.KARAKORAM_REPO }}
          ref: ${{ env.KARAKORAM_REF }}
          path: .karakoram-src
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build
        # configure-pages reports an http:// origin until the custom domain's
        # certificate exists; canonical URLs should always use https.
        run: SITE_URL="https://${PAGES_HOST}" npm run build
        env:
          KARAKORAM_DOCS_DIR: .karakoram-src
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          # Root for the custom domain, /<repo> for a github.io project page.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
